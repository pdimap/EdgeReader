name: Build and test EdgeReader on Windows

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Create EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name EdgeReader-2.0 --collect-all edge_tts --collect-all miniaudio --hidden-import=pythoncom --hidden-import=pywintypes edge_reader.py
      - name: Check EXE starts
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD\dist\EdgeReader-2.0.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "EdgeReader exited unexpectedly: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Get-FileHash dist/EdgeReader-2.0.1-Setup.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - name: Test install and uninstall
        shell: pwsh
        run: |
          $setup = Start-Process dist/EdgeReader-2.0.1-Setup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installation failed" }
          $dir = "$env:LOCALAPPDATA\Programs\EdgeReader"
          $app = Start-Process "$dir\EdgeReader.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed app exited" }
          Stop-Process -Id $app.Id -Force
          $remove = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall failed" }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EdgeReader-2.0-Windows-Beta
          path: |
            dist/EdgeReader-2.0.1-Setup.exe
            dist/SHA256.txt
          if-no-files-found: error
